<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Galería "Vacío", A-Frame</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Joystick táctil -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #joystick-zone {
        position: fixed;
        bottom: 20px;
        left: 20px;
        width: 150px;
        height: 150px;
        background: rgba(205, 70, 209, 0.5);
        border-radius: 500%;
        touch-action: none;
      }
      .a-enter-vr {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <a-scene fog="type: linear; color: black">
      <!-- RIG sin wasd-controls -->
      <a-entity id="rig">
        <a-entity
          id="camera"
          camera
          look-controls
          position="0 1.6 0"
        ></a-entity>
      </a-entity>

      <!-- Modelo -->
      <a-entity
        id="model"
        gltf-model="models/Vacío.glb"
        position="0 0 0"
      ></a-entity>

      <a-sky color="#616d6d"></a-sky>
    </a-scene>

    <!-- Zona del joystick -->
    <div id="joystick-zone"></div>

    <script>
      const rig = document.querySelector("#rig");
      const camera = document.querySelector("#camera").object3D;
      const SPEED = 0.06;

      // ----------- JOYSTICK -----------
      const joystick = nipplejs.create({
        zone: document.getElementById("joystick-zone"),
        mode: "static",
        position: { left: "75px", top: "75px" },
        color: "white",
        size: 120,
      });

      let joyX = 0;
      let joyY = 0;

      joystick.on("move", (evt, data) => {
        const force = data.force;
        const angle = data.angle ? data.angle.radian : 0;

        joyX = -Math.cos(angle) * force * SPEED; // izquierda/derecha
        joyY = -Math.sin(angle) * force * SPEED; // adelante/atrás
      });

      joystick.on("end", () => {
        joyX = 0;
        joyY = 0;
      });

      // ----------- WASD -----------
      let keyState = { w: false, a: false, s: false, d: false };

      window.addEventListener("keydown", (e) => {
        if (e.key.toLowerCase() in keyState) {
          keyState[e.key.toLowerCase()] = true;
        }
      });
      window.addEventListener("keyup", (e) => {
        if (e.key.toLowerCase() in keyState) {
          keyState[e.key.toLowerCase()] = false;
        }
      });

      // ----------- LOOP DE MOVIMIENTO -----------
      function tick() {
        const pos = rig.getAttribute("position");

        // Dirección de la cámara
        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);

        const forward = new THREE.Vector3(camDir.x, 0, camDir.z).normalize();
        const right = new THREE.Vector3()
          .crossVectors(forward, new THREE.Vector3(0, 1, 0))
          .normalize();

        // Entrada de WASD
        let keyX = 0;
        let keyY = 0;
        if (keyState.w) keyY -= SPEED;
        if (keyState.s) keyY += SPEED;
        if (keyState.a) keyX += SPEED;
        if (keyState.d) keyX -= SPEED;

        // Entrada combinada (WASD + Joystick)
        const totalX = keyX + joyX;
        const totalY = keyY + joyY;

        const move = forward
          .multiplyScalar(totalY)
          .add(right.multiplyScalar(totalX));

        rig.setAttribute("position", {
          x: pos.x + move.x,
          y: pos.y,
          z: pos.z + move.z,
        });

        requestAnimationFrame(tick);
      }
      tick();
    </script>
  </body>
</html>
