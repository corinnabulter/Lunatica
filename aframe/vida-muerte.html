<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>A-Frame Test</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-physics-system@v4.0.1/dist/aframe-physics-system.min.js"></script>
  </head>
  <body>
    <a-scene fog="type: linear; color: gray">
      

      <!-- Cámara con controles -->
      <a-entity
        id="camera"
        camera
        wasd-controls="acceleration: 13"
        look-controls
        position="0 1.8 0"
      ></a-entity>

      <!-- Modelo GLB -->
      <a-entity
        id="model"
        gltf-model="models/Vida-Muerte_opt.glb"
        position="0 0 0"
      ></a-entity>

      <a-sky color="#76979e"></a-sky>

      <script>
        const modelEl = document.querySelector('#model');
        const cameraEl = document.querySelector('#camera');

        modelEl.addEventListener('model-loaded', () => {
          const obj = modelEl.getObject3D('mesh').getObjectByName('POV'); // Empty en Blender
          if (obj) {
            // Ajusta la posición de la cámara
            cameraEl.setAttribute('position', {
              x: obj.position.x,
              y: obj.position.y,
              z: obj.position.z
            });

            // Ajusta la rotación de la cámara (radianes → grados)
            cameraEl.setAttribute('rotation', {
              x: THREE.Math.radToDeg(obj.rotation.x),
              y: THREE.Math.radToDeg(obj.rotation.y),
              z: THREE.Math.radToDeg(obj.rotation.z)
            });
          }
        });
      </script>
    </a-scene>
  </body>
</html>
